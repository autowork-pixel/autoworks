name: Deploy development Cloud Run API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_DEV to deploy the development API
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-development
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY_DEV'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    env:
      PROJECT_ID: autoworks-c9a6a
      REGION: asia-northeast3
      SERVICE: autoworks-api-dev
      TASKS_QUEUE: brand-search
      BUDGET_DISPLAY_NAME: autoworks-development-monthly-50000
      BUDGET_TOPIC: autoworks-budget-alerts
      BUDGET_SUBSCRIPTION: autoworks-budget-push-dev
      WEB_ORIGINS: https://autoworks-c9a6a.web.app,https://autoworks-c9a6a.firebaseapp.com
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      TASK_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_TASK_SERVICE_ACCOUNT }}
      KMS_KEY_NAME: ${{ vars.CLOUD_RUN_KMS_KEY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run test:server
      - run: npm run test:runtime-config
      - run: npm run test:container
      - run: npm run test:cloud-bootstrap
      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNTIME_SERVICE_ACCOUNT" || { echo "Missing CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT"; exit 1; }
          test -n "$TASK_SERVICE_ACCOUNT" || { echo "Missing CLOUD_RUN_TASK_SERVICE_ACCOUNT"; exit 1; }
          test -n "$KMS_KEY_NAME" || { echo "Missing CLOUD_RUN_KMS_KEY_NAME"; exit 1; }
          [[ "$RUNTIME_SERVICE_ACCOUNT" == *@"$PROJECT_ID".iam.gserviceaccount.com ]]
          [[ "$TASK_SERVICE_ACCOUNT" == *@"$PROJECT_ID".iam.gserviceaccount.com ]]
          [[ "$KMS_KEY_NAME" == projects/"$PROJECT_ID"/* ]]
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/823085494995/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: autoworks-github-deploy@autoworks-c9a6a.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy bootstrap revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source server \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --set-env-vars "^:^GOOGLE_CLOUD_PROJECT=$PROJECT_ID:TASKS_LOCATION=$REGION:TASKS_QUEUE=$TASKS_QUEUE:SERVICE_URL=https://bootstrap.invalid:WORKER_AUDIENCE=https://bootstrap.invalid:TASK_SERVICE_ACCOUNT_EMAIL=$TASK_SERVICE_ACCOUNT:KMS_KEY_NAME=$KMS_KEY_NAME:WEB_ORIGINS=$WEB_ORIGINS:BUDGET_DISPLAY_NAME=$BUDGET_DISPLAY_NAME" \
            --quiet
      - name: Pin worker audience to deployed service URL
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" == https://* ]] || { echo "Cloud Run URL not found"; exit 1; }
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "^:^SERVICE_URL=$SERVICE_URL:WORKER_AUDIENCE=$SERVICE_URL" \
            --quiet
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
        id: service
      - name: Verify public and internal boundaries
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.service_url }}
        run: |
          set -euo pipefail
          AUTOWORKS_API_BASE="$SERVICE_URL" npm run smoke:development-api
      - name: Grant only the caller identity and configure recovery schedule
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.service_url }}
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --member "serviceAccount:$TASK_SERVICE_ACCOUNT" --role roles/run.invoker --quiet
          if gcloud scheduler jobs describe autoworks-recovery-dev --project "$PROJECT_ID" --location "$REGION" >/dev/null 2>&1; then
            ACTION=update
          else
            ACTION=create
          fi
          gcloud scheduler jobs "$ACTION" http autoworks-recovery-dev \
            --project "$PROJECT_ID" --location "$REGION" \
            --schedule "*/5 * * * *" --time-zone "Asia/Seoul" \
            --uri "$SERVICE_URL/internal/v1/recovery:run" --http-method POST \
            --oidc-service-account-email "$TASK_SERVICE_ACCOUNT" \
            --oidc-token-audience "$SERVICE_URL" --quiet
          if gcloud pubsub subscriptions describe "$BUDGET_SUBSCRIPTION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud pubsub subscriptions update "$BUDGET_SUBSCRIPTION" \
              --project "$PROJECT_ID" --push-endpoint "$SERVICE_URL/internal/v1/budget-alerts:receive" \
              --push-auth-service-account "$TASK_SERVICE_ACCOUNT" --push-auth-token-audience "$SERVICE_URL" --quiet
          else
            gcloud pubsub subscriptions create "$BUDGET_SUBSCRIPTION" \
              --project "$PROJECT_ID" --topic "$BUDGET_TOPIC" --ack-deadline 60 \
              --push-endpoint "$SERVICE_URL/internal/v1/budget-alerts:receive" \
              --push-auth-service-account "$TASK_SERVICE_ACCOUNT" --push-auth-token-audience "$SERVICE_URL" --quiet
          fi
      - name: Connect Hosting to the deployed API
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.service_url }}
        run: |
          set -euo pipefail
          printf 'window.AUTOWORKS_API_BASE = "%s";\n' "$SERVICE_URL" > public/runtime-config.js
          npm run test:runtime-config
          npx --yes firebase-tools@15.34.2 deploy \
            --project "$PROJECT_ID" --only hosting,firestore:rules --non-interactive
          for attempt in 1 2 3 4 5 6; do
            npm run verify:hosting && exit 0
            sleep 5
          done
          exit 1

