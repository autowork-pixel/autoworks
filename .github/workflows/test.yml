name: Validate web and Firestore rules

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run test:html
      - run: npm run test:links
      - run: npm run test:security
      - run: npm run test:auth-state
      - run: npm run test:admin-controls
      - run: npm run test:account-deletion
      - run: npm run test:server
      - name: Test Firestore security rules
        run: npx --yes firebase-tools@latest emulators:exec --project demo-autoworks --only firestore "npm run test:rules"
