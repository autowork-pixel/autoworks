<div class="head"><div><h1>외부 서비스 연결</h1><p>사용할 기능에 필요한 API를 연결하고, 발급 방법을 화면으로 따라 해보세요.</p></div><span class="sync-label">연결 정보는 고객 계정별로 관리됩니다</span></div>

let selected="ads";
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){document.getElementById("serviceList").innerHTML=services.map(s=>'<button class="service '+(s.id===selected?"active":"")+'" data-id="'+s.id+'"><span class="service-icon">'+s.icon+'</span><span>'+s.name+'</span><span class="state">미연결</span></button>').join("");document.querySelectorAll(".service").forEach(b=>b.addEventListener("click",()=>{selected=b.dataset.id;draw()}));const s=services.find(x=>x.id===selected);let fields=s.fields.length?'<div class="section"><div class="section-title"><h3>인증 정보 입력</h3><span>* 필수 항목</span></div><div class="fields">'+s.fields.map((f,i)=>'<div class="field '+(s.fields.length===1?"full":"")+'"><label>'+escapeHtml(f[0])+' <span class="required">*</span></label><div class="'+(f[0].toLowerCase().includes("key")||f[0].toLowerCase().includes("secret")||f[0].includes("라이선스")?"input-wrap":"")+'"><input type="'+(f[0].toLowerCase().includes("key")||f[0].toLowerCase().includes("secret")||f[0].includes("라이선스")?"password":"text")+'" autocomplete="off" placeholder="'+escapeHtml(f[2])+'">'+(f[0].toLowerCase().includes("key")||f[0].toLowerCase().includes("secret")||f[0].includes("라이선스")?'<button class="eye" type="button">표시</button>':"")+'</div><p class="help">'+escapeHtml(f[1])+'</p></div>').join("")+'</div><div class="form-note"><strong>어디서 발급하나요?</strong> '+escapeHtml(s.notice)+'</div><div class="row-actions"><div class="action-links"><a class="small-link" target="_blank" rel="noopener" href="'+s.url+'">'+s.link+'</a><button class="small-link show-steps">발급 화면 따라하기</button></div><div class="buttons"><button class="btn secondary demo">연결 테스트</button><button class="btn primary demo">정보 저장</button></div></div></div>':'<div class="github-flow"><h3>안전한 앱 권한으로 연결</h3><p>오토웍스 계정과 GitHub 저장소 접근은 별도로 승인합니다. 필요한 저장소만 선택할 수 있도록 GitHub App 연동으로 연결할 예정입니다.</p><div class="buttons"><button class="btn primary demo">GitHub 연결</button><a class="small-link" target="_blank" rel="noopener" href="'+s.url+'">'+s.link+'</a></div><div class="form-note">연동 개발 전에는 GitHub 계정이나 저장소에 접근하지 않습니다. Personal Access Token을 여기에 입력하지 마세요.</div></div>';
document.getElementById("content").innerHTML='<div class="panel"><div class="panel-head"><div class="name"><div class="service-logo">'+s.icon+'</div><div><h2>'+s.name+'</h2><p>'+s.desc+'</p></div></div><span class="badge">연결 안 됨</span></div><div class="related"><div class="section"><div class="section-title"><h3>이 서비스가 필요한 기능</h3><span>연결 전 필요한 API 확인</span></div><div class="need">'+(s.id==="ads"||s.id==="hub"?'<span>브랜드 데일리 검색량</span><span>일별 관심 추이</span>':s.id==="youtube"?'<span>화제 콘텐츠 레퍼런스</span><span>인플루언서 후보</span>':s.id==="openai"?'<span>AI 분석</span><span>블로그 콘텐츠 작성</span>':s.id==="higgsfield"?'<span>영상·이미지 생성</span>':'<span>GitHub 로그인</span><span>저장소 연결</span>')+'</div></div></div>'+fields+'</div><section class="help-panel"><div class="help-top"><h2>발급 경로 안내</h2><span>화면 예시를 누르면 크게 볼 수 있어요</span></div><div class="help-grid">'+s.steps.map((st,i)=>'<article class="guide-card"><button class="shot" data-step="'+i+'" aria-label="'+escapeHtml(st[0])+' 화면 안내 크게 보기">'+svgFor(s,st,i)+'<span class="shot-label">크게 보기 ↗</span></button><div class="guide-copy"><b>'+escapeHtml(st[0])+'</b><p>'+escapeHtml(st[1])+'</p></div></article>').join("")+'</div></section><div class="warning"><b>발급 경로</b> '+escapeHtml(s.steps.map(x=>x[2]).join("　›　"))+'</div>';
document.querySelectorAll(".eye").forEach(b=>b.addEventListener("click",()=>{const input=b.parentElement.querySelector("input");input.type=input.type==="password"?"text":"password";b.textContent=input.type==="password"?"표시":"숨기기"}));document.querySelectorAll(".demo").forEach(b=>b.addEventListener("click",()=>toast("미리보기 화면입니다. 입력값은 저장되거나 전송되지 않아요.")));document.querySelector(".show-steps")?.addEventListener("click",()=>document.querySelector(".help-panel").scrollIntoView({behavior:"smooth"}));document.querySelectorAll(".shot").forEach(b=>b.addEventListener("click",()=>zoom(s,Number(b.dataset.step))))}
function svgFor(s,st,i){const route=st[2].split(" → "),safe=escapeHtml;return '<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+safe(s.name+" "+st[0]+" 화면 위치 안내 예시")+'"><rect width="620" height="300" rx="9" fill="#f3f5f8"/><rect width="620" height="35" rx="9" fill="#30394b"/><rect y="27" width="620" height="8" fill="#30394b"/><circle cx="17" cy="17" r="4" fill="#f47a70"/><circle cx="32" cy="17" r="4" fill="#f3c45f"/><circle cx="47" cy="17" r="4" fill="#64c992"/><rect x="90" y="10" width="320" height="14" rx="6" fill="#ffffff25"/><text x="104" y="20" font-size="8" fill="#fff" font-family="Arial">'+safe(s.name)+" · "+safe(st[0])+'</text><rect x="0" y="35" width="145" height="265" fill="#fff"/><text x="16" y="61" font-size="10" font-weight="700" fill="#424b5c" font-family="Arial">'+safe(s.name)+'</text>'+route.map((x,j)=>'<rect x="10" y="'+(75+j*29)+'" width="124" height="22" rx="5" fill="'+(j===route.length-1?'#ecefff':'#fff')+'"/><text x="19" y="'+(89+j*29)+'" font-size="8" fill="'+(j===route.length-1?'#4d5ac4':'#758091')+'" font-family="Arial">'+safe(x)+'</text>').join("")+'<text x="166" y="68" font-size="8" fill="#8991a0" font-family="Arial">'+safe(route.join(" / "))+'</text><text x="166" y="101" font-size="16" font-weight="700" fill="#293141" font-family="Arial">'+safe(st[0])+'</text><rect x="166" y="119" width="430" height="116" rx="8" fill="#fff" stroke="#e0e4ec"/><text x="183" y="146" font-size="9" fill="#667183" font-family="Arial">'+safe(st[1].slice(0,70))+'</text><rect x="182" y="162" width="395" height="44" rx="6" fill="#f7f8fb" stroke="#e4e7ee"/><text x="195" y="188" font-size="10" fill="#475267" font-family="Arial">'+safe(route[route.length-1])+'</text><rect x="174" y="153" width="410" height="61" rx="8" fill="none" stroke="#e9a13e" stroke-width="3"/><path d="M580 138l-16 12h10l-1 10 14-16h-9z" fill="#e9a13e"/><text x="166" y="264" font-size="8" fill="#8991a0" font-family="Arial">화면 예시 · 실제 제공자 콘솔 화면은 계정과 개편 시점에 따라 다를 수 있습니다</text></svg>'}
function zoom(s,i){const st=s.steps[i];document.getElementById("modalTitle").textContent=s.name+" · "+st[0];document.getElementById("modalArt").innerHTML=svgFor(s,st,i);document.getElementById("modalCaption").textContent=st[1]+" 이동 경로: "+st[2]+". 이 이미지는 메뉴 위치를 설명하는 화면 예시입니다.";document.getElementById("modal").classList.add("open")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2600)}
document.getElementById("close").addEventListener("click",()=>document.getElementById("modal").classList.remove("open"));document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("modal").classList.remove("open")});draw();
</script></body></html>
