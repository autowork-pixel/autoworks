<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 취소 · 오토웍스</title><style>:root{font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#242631;background:#f6f5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(500px,100%);background:#fff;border:1px solid #e4e1ee;border-radius:16px;padding:28px}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff0f0;color:#b84545;font-weight:900}h1{font-size:23px;margin:18px 0 8px}p{font-size:13px;line-height:1.7;color:#6c6878}.state{margin:18px 0;padding:13px;border-radius:9px;background:#f7f6fa;font-size:12px}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:11px;font-size:12px;font-weight:700;background:#5d49d3;color:#fff}.actions a.secondary{background:#fff;color:#5d49d3;border:1px solid #d8d1f1}</style></head>
<body><main class="card"><div class="mark">!</div><h1>결제가 완료되지 않았어요</h1><p>결제창을 닫거나 인증을 취소한 경우 구독은 활성화되지 않습니다. 결제 완료로 표시되지 않으면 다시 시도할 수 있습니다.</p><div class="state" id="state" role="status">결제 요청이 취소되었거나 승인되지 않았습니다.</div><div class="actions"><a href="./index.html#subscriptionCard">구독 상태 확인</a><a class="secondary" href="./help.html">고객센터</a></div></main>
<script>const params=new URLSearchParams(location.search),code=params.get("code");history.replaceState(null,"",location.pathname);if(code)document.getElementById("state").textContent=`결제가 완료되지 않았습니다. 오류 코드: ${String(code).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40)||"확인 필요"}`;</script></body></html>
