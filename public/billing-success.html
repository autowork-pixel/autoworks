<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구독 확인 · 오토웍스</title>
<style>:root{font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#242631;background:#f6f5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(500px,100%);background:#fff;border:1px solid #e4e1ee;border-radius:16px;padding:28px;box-shadow:0 14px 40px #33246612}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eeeaff;color:#5d49d3;font-weight:900}h1{font-size:23px;margin:18px 0 8px}p{font-size:13px;line-height:1.7;color:#6c6878}.state{margin:18px 0;padding:13px;border-radius:9px;background:#f7f6fa;font-size:12px}.signin{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.signin[hidden],button[hidden]{display:none}.signin button,#retry{border:1px solid #d8d1f1;background:#fff;color:#5d49d3;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer}#retry{margin-bottom:12px}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:11px;font-size:12px;font-weight:700;background:#5d49d3;color:#fff}.actions a.secondary{background:#fff;color:#5d49d3;border:1px solid #d8d1f1}</style>
</head>
<body><main class="card"><div class="mark">✓</div><h1>결제 결과를 확인하고 있어요</h1><p>서버가 결제사 응답과 주문 금액을 다시 대조한 뒤 구독을 활성화합니다. 이 화면을 새로고침해도 같은 결제가 중복 승인되지 않도록 처리합니다.</p><div class="state" id="state" role="status">로그인 상태를 확인하는 중입니다.</div><div class="signin" id="signin" hidden><button type="button" data-provider="google">Google로 로그인</button><button type="button" data-provider="naver">네이버로 로그인</button><button type="button" data-provider="kakao">카카오로 로그인</button></div><button type="button" id="retry" hidden>결제 확인 다시 시도</button><div class="actions"><a href="./index.html#subscriptionCard">구독 상태 보기</a><a class="secondary" href="./help.html">문제가 있나요?</a></div></main>
<script src="./runtime-config.js"></script>
<script type="module">
const state=document.getElementById("state"),signin=document.getElementById("signin"),retry=document.getElementById("retry"),params=new URLSearchParams(location.search),workspaceId=params.get("workspaceId"),sessionId=params.get("sessionId"),customerKey=params.get("customerKey"),authKey=params.get("authKey"),apiBase=String(window.AUTOWORKS_API_BASE||"").replace(/\/$/,"");
history.replaceState(null,"",location.pathname);
const validId=value=>typeof value==="string"&&/^[A-Za-z0-9_-]{1,128}$/.test(value);
if(!validId(workspaceId)||!validId(sessionId)||!validId(customerKey)||typeof authKey!=="string"||!authKey||authKey.length>300){state.textContent="결제 결과 정보가 올바르지 않습니다. 다시 결제하지 말고 고객센터로 문의해 주세요."}else if(!apiBase){state.textContent="결제 확인 서버가 아직 연결되지 않았습니다. 결제는 완료 처리되지 않았습니다."}else{
 const firebaseConfig={apiKey:"AIzaSyC4j2aelRB3uEyGmZJbvW0OGNL5-Oi2uvA",authDomain:"autoworks-c9a6a.firebaseapp.com",projectId:"autoworks-c9a6a",storageBucket:"autoworks-c9a6a.firebasestorage.app",messagingSenderId:"823085494995",appId:"1:823085494995:web:3be4bdd40fe0519bc59a26"};
 const {initializeApp}=await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js");
 const {getAuth,GoogleAuthProvider,signInWithPopup,signInWithCustomToken,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js");
 const auth=getAuth(initializeApp(firebaseConfig));
 let completing=false,completed=false;
 async function confirmPayment(user){
  if(!user||completing||completed)return;
  completing=true;signin.hidden=true;retry.hidden=true;state.textContent="주문과 결제 결과를 확인하는 중입니다.";
  try{
   const response=await fetch(`${apiBase}/v1/workspaces/${encodeURIComponent(workspaceId)}/billing-sessions/${encodeURIComponent(sessionId)}:complete`,{method:"POST",headers:{authorization:`Bearer ${await user.getIdToken()}`,"content-type":"application/json"},body:JSON.stringify({customerKey,authKey})});
   const result=await response.json().catch(()=>({}));
   if(!response.ok||result.status!=="active")throw new Error(result.error?.code||"PAYMENT_CONFIRM_FAILED");
   completed=true;state.textContent="구독이 활성화되었습니다. 구독 상태에서 이용 기간과 다음 결제일을 확인해 주세요.";
  }catch(error){
   const review=error.message==="PAYMENT_REVIEW_REQUIRED";
   state.textContent=review?"결제 승인 결과를 확인 중입니다. 추가 결제하지 말고 고객센터로 문의해 주세요.":"결제 확인을 완료하지 못했습니다. 결제를 시작한 계정을 확인하거나 같은 화면에서 다시 시도해 주세요. 중복 결제는 하지 마세요.";
   signin.hidden=review;retry.hidden=review;console.error("결제 완료 확인 실패",error.message);
  }finally{completing=false}
 }
 onAuthStateChanged(auth,user=>{if(!user){signin.hidden=false;retry.hidden=true;state.textContent="결제를 시작한 계정으로 이 화면에서 로그인해 주세요.";return}confirmPayment(user)});
 signin.addEventListener("click",async event=>{
  const provider=event.target.closest("[data-provider]")?.dataset.provider;
  if(!provider)return;
  if(provider==="google"){
   try{await signInWithPopup(auth,new GoogleAuthProvider())}catch{state.textContent="Google 로그인에 실패했습니다. 결제를 시작한 계정으로 다시 시도해 주세요."}
   return;
  }
  const popup=window.open(`${apiBase}/v1/auth/${provider}/start?returnOrigin=${encodeURIComponent(location.origin)}`,"autoworks-oauth","popup,width=520,height=720");
  state.textContent=popup?"로그인 제공자 화면에서 계속해 주세요.":"로그인 팝업이 차단되었습니다. 팝업을 허용해 주세요.";
 });
 window.addEventListener("message",async event=>{
  if(event.origin!==new URL(apiBase).origin||event.data?.type!=="autoworks-oauth"||typeof event.data.customToken!=="string")return;
  try{await signInWithCustomToken(auth,event.data.customToken)}catch{state.textContent="외부 로그인 정보를 연결하지 못했습니다. 다시 시도해 주세요."}
 });
 retry.addEventListener("click",()=>confirmPayment(auth.currentUser));
}
</script></body></html>
