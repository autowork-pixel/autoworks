1fr}.draft{min-height:380px}}</style></head><body><header class="top"><a href="./index.html">← 오토웍스</a></header><main class="wrap"><span class="eyebrow">콘텐츠 제작</span><h1>채널별 콘텐츠 자동 제작</h1><p class="intro">한 번 입력한 사실과 기준 원고로 채널별 검토용 콘텐츠 묶음을 만듭니다.</p><p class="notice"><b>자동 게시하지 않습니다.</b> 생성 결과는 초안이며 사실·표현·저작권·광고 심의를 사람이 확인해야 합니다. 이미지·영상은 제작 메모만 만들고 실제 미디어 생성이나 채널 발행은 별도 승인 전 수행하지 않습니다.</p><section class="grid"><form class="card" id="packForm"><h2>제작 조건</h2><button class="secondary" id="login" type="button">Google로 로그인</button><div class="field"><label for="project">프로젝트</label><select id="project" required disabled><option value="">로그인 후 선택</option></select></div><div class="field"><label for="campaign">캠페인</label><input id="campaign" required maxlength="120"></div><div class="field"><label for="facts">확인된 사실</label><textarea id="facts" required maxlength="5000"></textarea></div><div class="field"><label for="sourceDraft">기준 원고 (선택)</label><textarea id="sourceDraft" maxlength="12000"></textarea></div><div class="field"><label for="audience">타깃</label><input id="audience" required maxlength="160"></div><div class="field"><label for="callToAction">행동 유도</label><input id="callToAction" required maxlength="200"></div><div class="field"><label>제작 채널</label><div class="checks" id="channels"><label><input type="checkbox" value="블로그" checked> 블로그</label><label><input type="checkbox" value="인스타그램"> 인스타그램</label><label><input type="checkbox" value="스레드"> 스레드</label><label><input type="checkbox" value="숏폼 대본"> 숏폼 대본</label></div></div><button class="primary" id="submit" type="submit" disabled>검토용 콘텐츠 묶음 생성</button><p class="status" id="status" role="status">로그인·유료 구독·OpenAI API 연결이 필요합니다.</p></form><section class="card"><h2>생성 결과</h2><div class="field"><label for="history">저장된 콘텐츠</label><select id="history" disabled><option value="">로그인 후 불러옵니다.</option></select></div><textarea class="draft" id="draft" readonly placeholder="채널별 Markdown 초안이 표시됩니다."></textarea><p class="meta" id="meta">미게시 상태로만 저장됩니다.</p><div class="actions"><button class="secondary" id="copy" type="button" disabled>복사</button><button class="secondary" id="download" type="button" disabled>Markdown 저장</button></div></section></section></main><script src="./runtime-config.js"></script><script type="module" src="./content-pack.js?v=20261108-history"></script></body></html>
