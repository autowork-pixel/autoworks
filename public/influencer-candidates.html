<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인플루언서 후보 찾기 | 오토웍스</title><style>
:root{font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#282a35;background:#f6f6f9}*{box-sizing:border-box}body{margin:0}.top{height:58px;background:#fff;border-bottom:1px solid #e7e7ed;display:flex;align-items:center;padding:0 max(calc((100vw - 1040px)/2),20px)}.top a{color:#2d2e37;text-decoration:none;font-weight:800}.wrap{max-width:1040px;margin:auto;padding:34px 20px 70px}.eyebrow{font-size:10px;color:#6452c9;font-weight:800}h1{font-size:27px;margin:8px 0}.intro,.notice,.status{font-size:11px;line-height:1.7;color:#747783}.notice{margin:20px 0;background:#fff8df;border:1px solid #ecdfb6;border-radius:10px;padding:13px 15px}.grid{display:grid;grid-template-columns:360px 1fr;gap:12px}.card{background:#fff;border:1px solid #e3e4ea;border-radius:12px;padding:18px}.card h2{font-size:14px;margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:10px;font-weight:700}.field input,.field select{width:100%;border:1px solid #dfe1e7;border-radius:7px;padding:10px;font:inherit;font-size:11px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary,.secondary{width:100%;border:0;border-radius:8px;padding:11px;font-weight:800}.primary{background:#5d49d3;color:#fff}.secondary{background:#f0eff8;color:#5546ab}.primary:disabled,.secondary:disabled{opacity:.55}.status.error{color:#b94444}.status.success{color:#26764d}.results{display:grid;gap:8px}.candidate{display:grid;grid-template-columns:56px 1fr;gap:12px;border:1px solid #ececf1;border-radius:9px;padding:11px;color:inherit;text-decoration:none}.candidate img{width:56px;height:56px;object-fit:cover;border-radius:50%;background:#eee}.candidate b{font-size:12px}.candidate span{display:block;font-size:9px;color:#81848e;margin-top:4px;line-height:1.45}.empty{font-size:10px;color:#8b8e98;padding:30px 0;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}
</style></head><body><header class="top"><a href="./index.html">← 오토웍스</a></header><main class="wrap"><span class="eyebrow">후보 탐색</span><h1>인플루언서 후보 찾기</h1><p class="intro">브랜드와 키워드에 맞는 YouTube 공개 채널을 구독자 범위로 찾습니다.</p><p class="notice"><b>검토 전용</b> · 이 기능은 공개 채널 후보를 정리할 뿐 연락처를 추정하거나 메시지를 발송하지 않습니다. 숨김 구독자 채널은 범위를 확인할 수 없어 제외합니다. 연락 전 사람이 적합성·표시광고·플랫폼 정책을 확인해야 합니다.</p><section class="grid"><form class="card" id="candidateForm"><h2>탐색 조건</h2><button class="secondary" id="login" type="button">Google로 로그인</button><div class="field"><label for="project">프로젝트</label><select id="project" required disabled><option value="">로그인 후 선택</option></select></div><div class="field"><label for="brand">브랜드</label><input id="brand" required maxlength="80"></div><div class="field"><label for="keywords">키워드</label><input id="keywords" required maxlength="400" placeholder="쉼표로 구분, 최대 5개"></div><div class="pair"><div class="field"><label for="subscriberMin">최소 구독자</label><input id="subscriberMin" type="number" min="0" max="1000000000" value="1000" required></div><div class="field"><label for="subscriberMax">최대 구독자</label><input id="subscriberMax" type="number" min="0" max="1000000000" value="100000" required></div></div><div class="field"><label for="candidateCount">후보 수</label><select id="candidateCount"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option></select></div><button class="primary" id="submit" type="submit" disabled>후보 찾기</button><p class="status" id="status" role="status">로그인·유료 구독·YouTube API 연결이 필요합니다.</p><a href="./api-guide.html" class="intro">YouTube API 키 연결 방법 →</a></form><section class="card"><h2>후보 결과</h2><div class="field"><label for="history">저장된 결과</label><select id="history" disabled><option value="">로그인 후 불러옵니다.</option></select></div><div class="results" id="results"><p class="empty">아직 저장된 후보가 없습니다.</p></div></section></section></main><script src="./runtime-config.js"></script><script type="module" src="./influencer-candidates.js"></script></body></html>
